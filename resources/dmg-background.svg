<svg width="660" height="420" viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="50%" stop-color="#1a1f2b" />
      <stop offset="100%" stop-color="#0f1218" />
    </linearGradient>

    <!-- Subtle Arrow Glow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="1" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="660" height="420" fill="url(#bgGrad)" />

  <!-- Inner Studio Border Frame -->
  <rect x="14" y="14" width="632" height="392" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Header Title & Drag Guide Instruction -->
  <g transform="translate(330, 60)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">AetherGrok Desktop Studio</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.2">Drag AetherGrok to the Applications folder to install</text>
  </g>

  <!-- Directional Drag Arrow in the Center -->
  <g transform="translate(330, 215)">
    <!-- Ambient Connecting Line -->
    <line x1="-50" y1="0" x2="45" y2="0" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
    <!-- Chevrons -->
    <path d="M 16 -11 L 32 0 L 16 11" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33 -11 L 49 0 L 33 11" fill="none" stroke="#bfdbfe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse Dots -->
    <circle cx="-32" cy="0" r="3" fill="#60a5fa" opacity="0.7" />
    <circle cx="-8" cy="0" r="3.5" fill="#60a5fa" opacity="0.9" />
  </g>

  <!-- Footer Tag -->
  <g transform="translate(330, 385)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#64748b" letter-spacing="0.3">v1.0.1 • Universal macOS Application</text>
  </g>
</svg>
