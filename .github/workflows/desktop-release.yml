name: Build & Release Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.1.0). If provided, assets are automatically attached to the GitHub release."
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS App, DMG & Portable Package (${{ matrix.arch }})
        run: bash build-macos.sh ${{ matrix.arch }}

      - name: Upload macOS Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: aethergrok-macos-${{ matrix.arch }}
          path: |
            build/bin/*.dmg
            build/bin/*.tar.gz
            build/bin/*.sha256
          retention-days: 14

      - name: Attach to GitHub Release (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name || inputs.release_tag }}
        run: |
          TARGET_TAG="${TAG_NAME}"
          if [ -z "$TARGET_TAG" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TARGET_TAG="${{ inputs.release_tag }}"
          fi
          if [ -n "$TARGET_TAG" ]; then
            gh release upload "$TARGET_TAG" build/bin/*.dmg build/bin/*.tar.gz build/bin/*.sha256 --clobber || echo "No release with tag $TARGET_TAG found"
          fi

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows Executable & Installer (${{ matrix.arch }})
        shell: pwsh
        run: |
          $Version = "1.0.0"
          if (Test-Path "wails.json") {
            $wailsJson = Get-Content "wails.json" | ConvertFrom-Json
            if ($wailsJson.version) { $Version = $wailsJson.version }
          }
          
          # Build NSIS Setup Installer
          wails build -platform "windows/${{ matrix.arch }}" -nsis -clean -ldflags "-s -w"
          
          # Create Portable Zip Archive
          $TargetExe = "build/bin/aethergrok.exe"
          if (Test-Path "build/bin/AetherGrok.exe") { $TargetExe = "build/bin/AetherGrok.exe" }
          
          $PortableName = "AetherGrok-${Version}-windows-${{ matrix.arch }}-portable.zip"
          Compress-Archive -Path $TargetExe -DestinationPath "build/bin/$PortableName" -Force
          
          # Standardize Installer Name if exists
          $Installer = Get-Item "build/bin/*installer*.exe" -ErrorAction SilentlyContinue
          if ($Installer) {
            $StandardInstallerName = "AetherGrok-${Version}-windows-${{ matrix.arch }}-setup.exe"
            Rename-Item -Path $Installer.FullName -NewName $StandardInstallerName -Force
          }
          
          # Generate Checksums
          Get-ChildItem -Path "build/bin" -Include @("*.exe", "*.zip") | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
          }

      - name: Upload Windows Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: aethergrok-windows-${{ matrix.arch }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
            build/bin/*.sha256
          retention-days: 14

      - name: Attach to GitHub Release (Windows ${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name || inputs.release_tag }}
        run: |
          $TargetTag = $env:TAG_NAME
          if (-not $TargetTag -and $env:RELEASE_TAG_INPUT) {
            $TargetTag = $env:RELEASE_TAG_INPUT
          }
          if ($TargetTag) {
            gh release upload "$TargetTag" build/bin/*.exe build/bin/*.zip build/bin/*.sha256 --clobber
          }
