name: Build Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to only produce downloadable artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Installer (.dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS App & DMG Package
        run: bash build-macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aethergrok-macos-dmg
          path: |
            build/bin/*.dmg
            build/bin/*.dmg.sha256
          retention-days: 14

      - name: Attach to GitHub Release (macOS)
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" build/bin/*.dmg build/bin/*.dmg.sha256 --clobber || echo "No release with tag ${{ inputs.release_tag }} found"

  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows Executable & NSIS Installer
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -nsis

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aethergrok-windows-exe
          path: |
            build/bin/*.exe
          retention-days: 14

      - name: Attach to GitHub Release (Windows)
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" build/bin/*.exe --clobber
