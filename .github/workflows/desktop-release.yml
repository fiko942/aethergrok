name: Build & Release Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.1.0). If provided, assets are automatically attached to the GitHub release."
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS App & DMG Installer (${{ matrix.arch }})
        run: bash build-macos.sh ${{ matrix.arch }}

      - name: Upload macOS Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: aethergrok-macos-${{ matrix.arch }}
          path: |
            build/bin/*.dmg
            build/bin/*.sha256
          retention-days: 14

      - name: Attach to GitHub Release (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TARGET_TAG="${TAG_NAME}"
          if [[ "$TARGET_TAG" != v* ]]; then
            if [ -f "wails.json" ]; then
              VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('wails.json')).version || '')")
              if [ -n "$VERSION" ]; then
                TARGET_TAG="v${VERSION}"
              fi
            fi
          fi
          echo "Target Release Tag: $TARGET_TAG"
          if [ -n "$TARGET_TAG" ]; then
            gh release upload "$TARGET_TAG" build/bin/*.dmg build/bin/*.sha256 --clobber || echo "Failed or tag $TARGET_TAG not yet published"
          fi

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path "C:\Program Files\NSIS") { $nsisPath = "C:\Program Files\NSIS" }
          Write-Host "Adding NSIS to PATH: $nsisPath"
          echo "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows Executable & Installer (${{ matrix.arch }})
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\NSIS") { $env:PATH += ";C:\Program Files (x86)\NSIS" }
          if (Test-Path "C:\Program Files\NSIS") { $env:PATH += ";C:\Program Files\NSIS" }

          $Version = "1.0.0"
          if (Test-Path "wails.json") {
            $wailsJson = Get-Content "wails.json" | ConvertFrom-Json
            if ($wailsJson.version) { $Version = $wailsJson.version }
          }
          
          # Build NSIS Setup Installer
          wails build -platform "windows/${{ matrix.arch }}" -nsis -clean -ldflags "-s -w"
          
          # Create Portable Zip Archive
          $TargetExe = "build/bin/aethergrok.exe"
          if (Test-Path "build/bin/AetherGrok.exe") { $TargetExe = "build/bin/AetherGrok.exe" }
          
          $PortableName = "AetherGrok-${Version}-windows-${{ matrix.arch }}-portable.zip"
          Compress-Archive -Path $TargetExe -DestinationPath "build/bin/$PortableName" -Force
          
          # Standardize Installer Name if exists
          $Installer = Get-ChildItem -Path "build/bin" -File | Where-Object { $_.Name -like "*installer*.exe" -or $_.Name -like "*setup*.exe" } | Select-Object -First 1
          if ($Installer) {
            $StandardInstallerName = "AetherGrok-${Version}-windows-${{ matrix.arch }}-setup.exe"
            if ($Installer.Name -ne $StandardInstallerName) {
              Rename-Item -Path $Installer.FullName -NewName $StandardInstallerName -Force
            }
          }
          
          # Generate Checksums
          Get-ChildItem -Path "build/bin" -File | Where-Object { $_.Extension -in @(".exe", ".zip") } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
          }

      - name: Upload Windows Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: aethergrok-windows-${{ matrix.arch }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
            build/bin/*.sha256
          retention-days: 14

      - name: Attach to GitHub Release (Windows ${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $TargetTag = $env:INPUT_TAG
          if (-not $TargetTag) {
            $TargetTag = $env:REF_NAME
          }
          if ($TargetTag -notmatch '^v\d+') {
            if (Test-Path "wails.json") {
              $wailsJson = Get-Content "wails.json" | ConvertFrom-Json
              if ($wailsJson.version) { $TargetTag = "v$($wailsJson.version)" }
            }
          }
          Write-Host "Target Release Tag: $TargetTag"
          if ($TargetTag) {
            $filesToUpload = Get-ChildItem -Path "build/bin" -File | Where-Object { $_.Extension -in @(".exe", ".zip", ".sha256") } | Select-Object -ExpandProperty FullName
            if ($filesToUpload) {
              gh release upload "$TargetTag" $filesToUpload --clobber
            }
          }
